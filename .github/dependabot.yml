version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
