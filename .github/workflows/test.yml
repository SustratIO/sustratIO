name: Test
description: Runs tests and checks format and linter.

on:
  push:
    branches: 
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env

      - name: Run Ruff Checker
        run: uv run ruff check .

      - name: Run Ruff Formatter
        run: uv run ruff format --check .

  test-unit:
    strategy:
      matrix:
        auth_engine:
          - null_auth
          - oauth0
      fail-fast: false

    name: Unit Tests (${{ matrix.auth_engine }})
    runs-on: ubuntu-latest

    env:
      AUTH_ENGINE: ${{ matrix.auth_engine }}
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.unit.${{ matrix.auth_engine }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env

      - name: In-Memory Test Suite
        if: matrix.auth_engine == 'null_auth'
        run: |
          uv run pytest -m "unit and not oauth0" --cov=src --cov-report= --verbose

      - name: OAuth0 Test Suite
        if: matrix.auth_engine == 'oauth0'
        run: |
          uv sync --group auth_jwt
          uv run pytest -m "unit and oauth0" --cov=src --cov-report= --verbose
      
      - name: Upload Raw Coverage Data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-unit-${{ matrix.auth_engine }}
          path: ${{ github.workspace }}/.coverage.unit.${{ matrix.auth_engine }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  test-integration:
    strategy:
      matrix:
        database_engine:
          - in_memory
      fail-fast: false

    name: Integration Tests (${{ matrix.database_engine }})
    runs-on: ubuntu-latest

    env:
      DATABASE_ENGINE: ${{ matrix.database_engine }}
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.integration.${{ matrix.database_engine }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
    
      - name: In-Memory Test Suite
        if: matrix.database_engine == 'in_memory'
        run: |
          uv run pytest -m "integration" --cov=src --cov-report= --verbose

      - name: Upload Raw Coverage Data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-integration-${{ matrix.database_engine }}
          path: ${{ github.workspace }}/.coverage.integration.${{ matrix.database_engine }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  combine-coverage:
    name: Combine Coverage & Enforce Threshold
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env

      - name: Download All Coverage Binary Artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Merge Coverage Data & Evaluate Threshold
        run: |
          # Combines all downloaded .coverage.* binaries into a single .coverage file
          uv run coverage combine

          uv run coverage report --show-missing --fail-under=95
          # Output XMl result
          uv run coverage xml -o coverage.xml

      - name: Upload Final Coverage XML
        uses: actions/upload-artifact@v6
        with:
          name: final-coverage-report
          path: coverage.xml
          retention-days: 7
          